<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 856" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="schema-title schema-desc" id="proposed-schema-root"><title id="schema-title">Five tables, thirty-one fields</title><desc id="schema-desc">The proposed PostgreSQL schema contains five independent tables with natural keys and no foreign keys.</desc><defs>
      <style>#proposed-schema-root { color: #2d3142; font-family: "Geist",system-ui,sans-serif; }
      #proposed-schema-root .eyebrow, #proposed-schema-root nav, #proposed-schema-root .tag, #proposed-schema-root .label, #proposed-schema-root .sqltype { font-family:"Geist Mono",monospace }
      #proposed-schema-root nav { display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid #bfc0c0;border-bottom:1px solid #bfc0c0;padding:20px 0;margin:32px 0 48px;font-size:13px }
      #proposed-schema-root a { color:#2e5aa8 }
      #proposed-schema-root section { margin-bottom:64px;scroll-margin-top:24px }
      #proposed-schema-root .diagram-container { width:100%;overflow-x:auto }
      #proposed-schema-root .name { font:600 16px "Geist",system-ui,sans-serif;fill:#2d3142 }
      #proposed-schema-root .body { font:400 12px "Geist",system-ui,sans-serif;fill:#4f5d75 }
      #proposed-schema-root .tag { font-size:8px;letter-spacing:.08em;fill:#4f5d75 }
      #proposed-schema-root .label { font-size:12px;fill:#4f5d75 }
      #proposed-schema-root .legend { font:400 11px "Geist",system-ui,sans-serif;fill:#4f5d75 }
      #proposed-schema-root .tablehead { font:600 14px "Geist",system-ui,sans-serif;fill:#2d3142 }
      #proposed-schema-root .field { font:600 12px "Geist",system-ui,sans-serif;fill:#2d3142 }
      #proposed-schema-root .sqltype { font-size:9px;fill:#4f5d75 }
      #proposed-schema-root .caption { font-size:14px;color:#4f5d75;max-width:1020px }
      #proposed-schema-root .status { border-left:3px solid #bf4520;padding:12px 20px;background:#f2e7e3 }
      #proposed-schema-root table { border-collapse:collapse;width:100%;font-size:14px;line-height:1.5 }
      #proposed-schema-root td, #proposed-schema-root th { text-align:left;vertical-align:top;padding:14px;border-bottom:1px solid #bfc0c0 }
      #proposed-schema-root th { font-weight:600 }
      #proposed-schema-root .files { display:flex;gap:24px;flex-wrap:wrap }
      #proposed-schema-root nav { display:none }
      #proposed-schema-root .diagram-container { overflow-x:visible }
      #proposed-schema-root section { break-before:page }
      #proposed-schema-root a { color:inherit }</style><marker id="proposed-schema-arr-04" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs><rect width="1280" height="856" fill="#f5f5f5"/><rect x="40" y="48" width="368" height="260" rx="6" fill="#fff" stroke="#4f5d75"/><text x="56" y="76" class="tablehead" text-anchor="start">students</text><text x="56" y="96" class="tag" text-anchor="start">TABLE · PUBLIC</text><rect x="41" y="100" width="366" height="28" fill="#f5f5f5"/><text x="56" y="118" class="field" text-anchor="start">telegram_user_id</text><text x="392" y="118" class="sqltype" text-anchor="end">BIGINT</text><text x="272" y="118" class="tag" text-anchor="start">PK</text><text x="56" y="146" class="field" text-anchor="start">username</text><text x="392" y="146" class="sqltype" text-anchor="end">TEXT</text><rect x="41" y="156" width="366" height="28" fill="#f5f5f5"/><text x="56" y="174" class="field" text-anchor="start">current_class</text><text x="392" y="174" class="sqltype" text-anchor="end">SMALLINT</text><text x="56" y="202" class="field" text-anchor="start">preferred_subject</text><text x="392" y="202" class="sqltype" text-anchor="end">TEXT</text><rect x="41" y="212" width="366" height="28" fill="#f5f5f5"/><text x="56" y="230" class="field" text-anchor="start">created_at</text><text x="392" y="230" class="sqltype" text-anchor="end">TIMESTAMPTZ</text><text x="56" y="258" class="field" text-anchor="start">last_updated</text><text x="392" y="258" class="sqltype" text-anchor="end">TIMESTAMPTZ</text><rect x="41" y="268" width="366" height="28" fill="#f5f5f5"/><text x="56" y="286" class="field" text-anchor="start">class_updated_year</text><text x="392" y="286" class="sqltype" text-anchor="end">INTEGER</text><rect x="456" y="48" width="368" height="260" rx="6" fill="#fff" stroke="#4f5d75"/><text x="472" y="76" class="tablehead" text-anchor="start">content_items</text><text x="472" y="96" class="tag" text-anchor="start">TABLE · PUBLIC</text><rect x="457" y="100" width="366" height="28" fill="#f5f5f5"/><text x="472" y="118" class="field" text-anchor="start">drive_file_id</text><text x="808" y="118" class="sqltype" text-anchor="end">TEXT</text><text x="688" y="118" class="tag" text-anchor="start">PK</text><text x="472" y="146" class="field" text-anchor="start">title</text><text x="808" y="146" class="sqltype" text-anchor="end">TEXT</text><rect x="457" y="156" width="366" height="28" fill="#f5f5f5"/><text x="472" y="174" class="field" text-anchor="start">link</text><text x="808" y="174" class="sqltype" text-anchor="end">TEXT</text><text x="472" y="202" class="field" text-anchor="start">level</text><text x="808" y="202" class="sqltype" text-anchor="end">TEXT</text><rect x="457" y="212" width="366" height="28" fill="#f5f5f5"/><text x="472" y="230" class="field" text-anchor="start">subject</text><text x="808" y="230" class="sqltype" text-anchor="end">TEXT</text><text x="472" y="258" class="field" text-anchor="start">resource_type</text><text x="808" y="258" class="sqltype" text-anchor="end">TEXT</text><rect x="457" y="268" width="366" height="28" fill="#f5f5f5"/><text x="472" y="286" class="field" text-anchor="start">topic</text><text x="808" y="286" class="sqltype" text-anchor="end">TEXT</text><rect x="872" y="48" width="368" height="148" rx="6" fill="#fff" stroke="#4f5d75"/><text x="888" y="76" class="tablehead" text-anchor="start">folders</text><text x="888" y="96" class="tag" text-anchor="start">TABLE · PUBLIC</text><rect x="873" y="100" width="366" height="28" fill="#f5f5f5"/><text x="888" y="118" class="field" text-anchor="start">drive_folder_id</text><text x="1224" y="118" class="sqltype" text-anchor="end">TEXT</text><text x="1104" y="118" class="tag" text-anchor="start">PK</text><text x="888" y="146" class="field" text-anchor="start">path</text><text x="1224" y="146" class="sqltype" text-anchor="end">TEXT</text><text x="1104" y="146" class="tag" text-anchor="start">UQ</text><rect x="873" y="156" width="366" height="28" fill="#f5f5f5"/><text x="888" y="174" class="field" text-anchor="start">url</text><text x="1224" y="174" class="sqltype" text-anchor="end">TEXT</text><rect x="40" y="412" width="368" height="260" rx="6" fill="#fff" stroke="#4f5d75"/><text x="56" y="440" class="tablehead" text-anchor="start">warnings</text><text x="56" y="460" class="tag" text-anchor="start">TABLE · PUBLIC</text><rect x="41" y="464" width="366" height="28" fill="#f5f5f5"/><text x="56" y="482" class="field" text-anchor="start">telegram_user_id</text><text x="392" y="482" class="sqltype" text-anchor="end">BIGINT</text><text x="272" y="482" class="tag" text-anchor="start">PK</text><text x="56" y="510" class="field" text-anchor="start">telegram_chat_id</text><text x="392" y="510" class="sqltype" text-anchor="end">BIGINT</text><text x="272" y="510" class="tag" text-anchor="start">PK</text><rect x="41" y="520" width="366" height="28" fill="#f5f5f5"/><text x="56" y="538" class="field" text-anchor="start">username</text><text x="392" y="538" class="sqltype" text-anchor="end">TEXT</text><text x="56" y="566" class="field" text-anchor="start">warning_count</text><text x="392" y="566" class="sqltype" text-anchor="end">INTEGER</text><rect x="41" y="576" width="366" height="28" fill="#f5f5f5"/><text x="56" y="594" class="field" text-anchor="start">last_reason</text><text x="392" y="594" class="sqltype" text-anchor="end">TEXT</text><text x="56" y="622" class="field" text-anchor="start">last_warning</text><text x="392" y="622" class="sqltype" text-anchor="end">TIMESTAMPTZ</text><rect x="41" y="632" width="366" height="28" fill="#f5f5f5"/><text x="56" y="650" class="field" text-anchor="start">banned</text><text x="392" y="650" class="sqltype" text-anchor="end">BOOLEAN</text><rect x="456" y="412" width="368" height="260" rx="6" fill="#fff" stroke="#4f5d75"/><text x="472" y="440" class="tablehead" text-anchor="start">interaction_events</text><text x="472" y="460" class="tag" text-anchor="start">TABLE · PUBLIC</text><rect x="457" y="464" width="366" height="28" fill="#f5f5f5"/><text x="472" y="482" class="field" text-anchor="start">event_id</text><text x="808" y="482" class="sqltype" text-anchor="end">UUID</text><text x="688" y="482" class="tag" text-anchor="start">PK</text><text x="472" y="510" class="field" text-anchor="start">telegram_update_id</text><text x="808" y="510" class="sqltype" text-anchor="end">BIGINT</text><text x="688" y="510" class="tag" text-anchor="start">UQ</text><rect x="457" y="520" width="366" height="28" fill="#f5f5f5"/><text x="472" y="538" class="field" text-anchor="start">telegram_user_id</text><text x="808" y="538" class="sqltype" text-anchor="end">BIGINT</text><text x="472" y="566" class="field" text-anchor="start">occurred_at</text><text x="808" y="566" class="sqltype" text-anchor="end">TIMESTAMPTZ</text><rect x="457" y="576" width="366" height="28" fill="#f5f5f5"/><text x="472" y="594" class="field" text-anchor="start">user_message</text><text x="808" y="594" class="sqltype" text-anchor="end">TEXT</text><text x="472" y="622" class="field" text-anchor="start">bot_response</text><text x="808" y="622" class="sqltype" text-anchor="end">TEXT</text><rect x="457" y="632" width="366" height="28" fill="#f5f5f5"/><text x="472" y="650" class="field" text-anchor="start">created_at</text><text x="808" y="650" class="sqltype" text-anchor="end">TIMESTAMPTZ</text><text x="888" y="444" class="name" text-anchor="start">No foreign-key lines are missing.</text><text x="888" y="476" class="body" text-anchor="start">Warnings and logs may exist before</text><text x="888" y="500" class="body" text-anchor="start">a student has a saved profile.</text><text x="888" y="556" class="name" text-anchor="start">The warning key has two parts.</text><text x="888" y="588" class="body" text-anchor="start">User ID + group ID identify one row.</text><text x="888" y="644" class="name" text-anchor="start">This proposal is not applied.</text><text x="888" y="676" class="body" text-anchor="start">Review and migration work: ENG-84.</text><line x1="40" y1="796" x2="1240" y2="796" stroke="#bfc0c0"/><text x="40" y="824" class="legend" text-anchor="start">PK = primary key · UQ = unique · All columns required except current_class, preferred_subject and telegram_update_id</text></svg>
