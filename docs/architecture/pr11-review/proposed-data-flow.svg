<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-title data-desc" id="proposed-data-flow-root"><title id="data-title">Files stay in Drive; records describe them</title><desc id="data-desc">Drive supplies catalogue metadata, while bot logic reads operational records and appends private logs.</desc><defs>
      <style>#proposed-data-flow-root { color: #2d3142; font-family: "Geist",system-ui,sans-serif; }
      #proposed-data-flow-root .eyebrow, #proposed-data-flow-root nav, #proposed-data-flow-root .tag, #proposed-data-flow-root .label, #proposed-data-flow-root .sqltype { font-family:"Geist Mono",monospace }
      #proposed-data-flow-root nav { display:flex;gap:24px;flex-wrap:wrap;border-top:1px solid #bfc0c0;border-bottom:1px solid #bfc0c0;padding:20px 0;margin:32px 0 48px;font-size:13px }
      #proposed-data-flow-root a { color:#2e5aa8 }
      #proposed-data-flow-root section { margin-bottom:64px;scroll-margin-top:24px }
      #proposed-data-flow-root .diagram-container { width:100%;overflow-x:auto }
      #proposed-data-flow-root .name { font:600 16px "Geist",system-ui,sans-serif;fill:#2d3142 }
      #proposed-data-flow-root .body { font:400 12px "Geist",system-ui,sans-serif;fill:#4f5d75 }
      #proposed-data-flow-root .tag { font-size:8px;letter-spacing:.08em;fill:#4f5d75 }
      #proposed-data-flow-root .label { font-size:12px;fill:#4f5d75 }
      #proposed-data-flow-root .legend { font:400 11px "Geist",system-ui,sans-serif;fill:#4f5d75 }
      #proposed-data-flow-root .tablehead { font:600 14px "Geist",system-ui,sans-serif;fill:#2d3142 }
      #proposed-data-flow-root .field { font:600 12px "Geist",system-ui,sans-serif;fill:#2d3142 }
      #proposed-data-flow-root .sqltype { font-size:9px;fill:#4f5d75 }
      #proposed-data-flow-root .caption { font-size:14px;color:#4f5d75;max-width:1020px }
      #proposed-data-flow-root .status { border-left:3px solid #bf4520;padding:12px 20px;background:#f2e7e3 }
      #proposed-data-flow-root table { border-collapse:collapse;width:100%;font-size:14px;line-height:1.5 }
      #proposed-data-flow-root td, #proposed-data-flow-root th { text-align:left;vertical-align:top;padding:14px;border-bottom:1px solid #bfc0c0 }
      #proposed-data-flow-root th { font-weight:600 }
      #proposed-data-flow-root .files { display:flex;gap:24px;flex-wrap:wrap }
      #proposed-data-flow-root nav { display:none }
      #proposed-data-flow-root .diagram-container { overflow-x:visible }
      #proposed-data-flow-root section { break-before:page }
      #proposed-data-flow-root a { color:inherit }</style><marker id="proposed-data-flow-arr-03" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker></defs><rect width="1280" height="720" fill="#f5f5f5"/><path d="M 304,172 H 400" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#proposed-data-flow-arr-03)"/><path d="M 704,172 H 928" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#proposed-data-flow-arr-03)"/><path d="M 1064,432 V 240" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#proposed-data-flow-arr-03)"/><path d="M 928,492 H 704" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#proposed-data-flow-arr-03)"/><path d="M 1064,536 V 604 Q 1064,612 1056,612 H 704" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#proposed-data-flow-arr-03)"/><path d="M 928,456 H 752 Q 744,456 744,448 V 328 Q 744,320 736,320 H 208 Q 200,320 200,328 V 432" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#proposed-data-flow-arr-03)"/><path d="M 88,432 V 224" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#proposed-data-flow-arr-03)"/><rect x="330.0" y="147" width="44" height="18" fill="#f5f5f5"/><text x="352" y="160" class="label" text-anchor="middle">SCAN</text><rect x="783.5" y="147" width="65" height="18" fill="#f5f5f5"/><text x="816" y="160" class="label" text-anchor="middle">PUBLISH</text><rect x="1066.0" y="331" width="44" height="18" fill="#f5f5f5"/><text x="1088" y="344" class="label" text-anchor="middle">READ</text><rect x="440.5" y="295" width="79" height="18" fill="#f5f5f5"/><text x="480" y="308" class="label" text-anchor="middle">SEND LINK</text><rect x="96.5" y="331" width="79" height="18" fill="#f5f5f5"/><text x="136" y="344" class="label" text-anchor="middle">OPEN FILE</text><rect x="40" y="120" width="264" height="104" rx="6" fill="#ececec" stroke="#4f5d75"/><text x="56" y="140" class="tag" text-anchor="start">ACTUAL FILES</text><text x="56" y="164" class="name" text-anchor="start">Google Drive</text><text x="56" y="188" class="body" text-anchor="start">Teachers upload PDFs and files</text><rect x="400" y="120" width="304" height="104" rx="6" fill="#f2e7e3" stroke="#bf4520"/><text x="416" y="140" class="tag" text-anchor="start">TARGET CORRECTNESS RULE</text><text x="416" y="164" class="name" text-anchor="start">Catalogue sync</text><text x="416" y="188" class="body" text-anchor="start">Publish only a complete scan</text><rect x="928" y="104" width="280" height="136" rx="6" fill="#ececec" stroke="#4f5d75"/><text x="944" y="124" class="tag" text-anchor="start">PROPOSED POSTGRES TABLES</text><text x="944" y="148" class="name" text-anchor="start">File and folder catalogue</text><text x="944" y="172" class="body" text-anchor="start">content_items: individual files</text><text x="944" y="196" class="body" text-anchor="start">folders: folder links</text><text x="944" y="220" class="body" text-anchor="start">Replace both together after validation</text><rect x="928" y="432" width="280" height="104" rx="6" fill="#ffffff" stroke="#4f5d75"/><text x="944" y="452" class="tag" text-anchor="start">BACKEND</text><text x="944" y="476" class="name" text-anchor="start">Shared bot logic</text><text x="944" y="500" class="body" text-anchor="start">Find resources and manage records</text><rect x="400" y="448" width="304" height="88" rx="6" fill="#ececec" stroke="#4f5d75"/><text x="416" y="476" class="name" text-anchor="start">Profiles and moderation</text><text x="416" y="500" class="body" text-anchor="start">students + warnings</text><rect x="400" y="568" width="304" height="72" rx="6" fill="#ececec" stroke="#4f5d75"/><text x="416" y="596" class="name" text-anchor="start">Private interaction log</text><text x="416" y="620" class="body" text-anchor="start">interaction_events: 7 proposed fields</text><rect x="40" y="432" width="264" height="104" rx="6" fill="#ffffff" stroke="#4f5d75"/><text x="56" y="452" class="tag" text-anchor="start">DELIVERY</text><text x="56" y="476" class="name" text-anchor="start">Student opens the link</text><text x="56" y="500" class="body" text-anchor="start">The file is served by Google Drive</text><line x1="40" y1="660" x2="1240" y2="660" stroke="#bfc0c0"/><text x="40" y="688" class="legend" text-anchor="start">PROPOSED · NOT APPLIED · Arrows show data use, not database foreign keys.</text></svg>
